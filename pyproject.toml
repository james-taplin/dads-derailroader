[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rr2dv"
version = "0.4.4"
description = "Convert Railroader stock steam locomotives into Derail Valley (CCL) packs"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# The app core uses the standard library only. Unity-side stages call the tooling's own Python environment.
dependencies = []

[project.scripts]
rr2dv = "rr2dv.cli:main"

[project.gui-scripts]
derailroader = "rr2dv.gui:main"  # the desktop app, without a console window on Windows

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rr2dv = ["unity/*.cs", "unity/materials/*", "spawn_tracks.json", "stock_locos.json", "gauge_fits.json", "oil_fits.json", "catalogue/*.json", "catalogue/pages/*.meta", "catalogue/pages/*/*"]
